name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: python -m pip install -r services/api/requirements.lock
      - run: python -m pip install --no-deps -e services/api
      - run: alembic -c services/api/alembic.ini upgrade head
      - run: alembic -c services/api/alembic.ini check
      - run: pytest services/api/tests -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - run: npm --prefix apps/web run lint
      - run: npm --prefix apps/web run build
